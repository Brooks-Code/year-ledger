services:
  - type: web
    name: year-ledger-api
    runtime: java
    # Maven 构建命令，如果是 Gradle 请改为: gradle build -x test
    buildCommand: mvn clean package -DskipTests
    # 启动命令，限制内存防止免费版 OOM
    startCommand: java -Xmx384m -Xms128m -jar target/year-ledger.jar
    plan: free
    region: singapore
    envVars:
      - key: JAVA_VERSION
        value: "8" # ⚠️ 改成你项目实际使用的 JDK 版本(如 8, 11, 17, 21)