# MySQL 数据库配置
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/year_ledger?useUnicode=true&characterEncoding=utf-8
    username: root
    password: 1234
    driver-class-name: com.mysql.jdbc.Driver

# MyBatis 配置
mybatis:
  configuration:
    # 自动将数据库的 user_name 映射到实体类的 userName
    map-underscore-to-camel-case: true
  # MyBatis Mapper XML 文件的位置
  mapper-locations: classpath:mapper/*.xml

# 服务器配置
server:
  # 优先读取 Render 分配的 PORT 变量，本地开发时默认使用 8080
  port: ${PORT:8080}
  # 让 Spring Boot 信任 Render 的反向代理（解决手机访问 Swagger 报错问题）
  forward-headers-strategy: NATIVE

# 智谱 API 配置
